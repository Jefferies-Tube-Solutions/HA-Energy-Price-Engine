name: Publish authorized PE beta.12
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/publish-beta12.yml]
permissions:
  contents: write
  checks: read
  actions: read
  pull-requests: write
concurrency:
  group: publish-pe-v0.1.0-beta.12
  cancel-in-progress: false
env:
  PE_SOURCE: e506ccfc40b61413bd83e3ce60081a60d517348f
  PE_TAG: v0.1.0-beta.12
  PE_TAG_OBJECT: 48479de326ad6386085ee228a5bee951e0d194cb
  PE_HACS_SHA: 211384a19c513009414acbde19f4eed55656ea957611b3211c2b5cfd62d0a5c8
  PE_MANUAL_SHA: 78eaebde562f59d7b25b514ba3c0cfc42ff1030393777d246347c119a18d4ed3
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.12
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Guard exact source, CI, immutable tag, main and prior releases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PE_SOURCE"
          test "$(git cat-file -t "$PE_TAG")" = tag
          test "$(git rev-parse "$PE_TAG")" = "$PE_TAG_OBJECT"
          test "$(git rev-parse "$PE_TAG^{commit}")" = "$PE_SOURCE"
          python - <<'PY'
          import json,os,subprocess,time
          from collections import Counter
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];source=os.environ['PE_SOURCE']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          required={'hassfest','hacs','independent beta install','tests (fixture-supported-ha-2026.10.3)','tests (current-ha-2026.10.4)','dashboard browser desktop and mobile'}
          for attempt in range(30):
              checks=api(f'commits/{source}/check-runs?per_page=100')['check_runs']
              if any(c['status']=='completed' and c['conclusion']!='success' for c in checks):raise SystemExit('Exact-source CI failed; no publication')
              counts=Counter(c['name'] for c in checks if c['status']=='completed' and c['conclusion']=='success')
              if len(checks)>=18 and all(counts[name]>=3 for name in required) and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):break
              time.sleep(10)
          else:raise SystemExit('Exact-source push/PR/tag CI pending; no publication')
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          pr=api('pulls/14');assert pr['state']=='open' and pr['draft'] and pr['head']['ref']=='feat/beta5-simple-onboarding'
          assert json.loads(Path('custom_components/ha_energy_price_engine/manifest.json').read_text())['version']=='0.1.0-beta.12'
          baseline='657bc49b091c1aa5fafa6cad0945cd693326d31c'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,source],check=True)
          import hashlib
          proof=json.loads(Path('docs/receipts/v0.1.0-beta.12-simulation.json').read_text())
          assert proof['baseline_commit']==baseline
          assert proof['native_diagnostics_per_site']==15 and proof['native_entity_count_per_four_band_site']==23
          assert proof['original_entity_ids_preserved']==66 and proof['price_ledgers_byte_identical']==2 and proof['site_configurations_preserved']==3
          assert proof['native_initial_default_yes'] and proof['native_configure_yes_no'] and proof['vat_amount_unchanged']
          assert proof['primary_values_and_state_classes_preserved'] and proof['existing_site_data_unchanged']
          assert proof['existing_merged_settings_unchanged_except_display_preference'] and proof['missing_final_keeps_four_verified_grid_ranges']
          assert proof['restart']['restarted'] and proof['restart']['persisted_no_all_three_sites'] and proof['restart']['configure_no_persisted']
          assert proof['restart']['original_ids_preserved']==66 and proof['restart']['no_duplicate_entities']
          assert proof['ledger_sha256_before']==proof['ledger_sha256_after_restart']
          assert not proof['errors'] and not proof['warnings'] and len(proof['screenshots'])==18
          assert proof['source_counts_before_views_and_toggles']==proof['source_counts_after_views_and_toggles']
          assert proof['yes']['vat']==proof['no']['vat']
          for key in ('period','start','end','revision'):assert proof['yes'][key]==proof['no'][key]
          for mode in ('yes','no'):
              assert abs(sum(proof[mode]['components'].values())-proof[mode]['final'])<1e-8
          assert proof['native_card']['passed'] and proof['native_card']['sourceCountsUnchanged'] and proof['native_card']['schema']==3
          assert not proof['owner_acceptance'] and not proof['physical_raspberry_pi_validated'] and not proof['production_or_charging_controls_touched']
          for path,digest in proof['screenshots'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest
          for path,digest in proof['tested_runtime_sha256'].items():
              current=Path('LICENSE') if path=='LICENSE' else Path('custom_components/ha_energy_price_engine')/path
              assert hashlib.sha256(current.read_bytes()).hexdigest()==digest
          assert proof['native_card']['sourceSHA256']==proof['tested_runtime_sha256']['www/energy-price-engine-card.js']
          assert len(proof['unchanged_beta11_runtime_sha256'])==18
          for path,digest in proof['unchanged_beta11_runtime_sha256'].items():
              current=Path('custom_components/ha_energy_price_engine')/path
              original=subprocess.check_output(['git','show',baseline+':'+str(current)])
              assert current.read_bytes()==original and hashlib.sha256(original).hexdigest()==digest
          allowed={'__init__.py','config_flow.py','configuration.py','dashboard.py','manifest.json','sensor.py','status.py','strings.json','translations/en.json','translations/da.json','www/energy-price-engine-card.js'}
          prefix='custom_components/ha_energy_price_engine/'
          changed=subprocess.check_output(['git','diff','--name-only',baseline,source,'--',prefix],text=True).splitlines()
          assert all(path.removeprefix(prefix) in allowed for path in changed)
          for number in range(1,12):
              tag=f'v0.1.0-beta.{number}';prior=json.loads(Path(f'docs/receipts/{tag}.json').read_text());release=api('releases/tags/'+tag)
              assert release['id']==prior['release_id'] and release['prerelease'] and not release['draft']
              assert api('git/ref/tags/'+tag)['object']['sha']==prior.get('tag_object',prior.get('annotated_tag_object'))
              assets={a['name']:a for a in release['assets']}
              for name,digest in prior.get('archive_hashes',prior.get('archive_sha256')).items():assert assets[name]['digest']=='sha256:'+digest
              for asset in prior.get('assets',[]):
                  assert all(assets[asset['name']].get(k)==asset[k] for k in ('id','size','digest') if k in asset)
          PY
      - name: Rebuild and independently install both immutable layouts
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes requirements-ha-current.lock
          uv run --no-project python tools/build_beta.py
          python - <<'PY'
          import json,os,hashlib,re
          from pathlib import Path
          m=json.loads(Path('dist/BUILD_MANIFEST.json').read_text())
          expected={'ha_energy_price_engine.zip':os.environ['PE_HACS_SHA'],'ha_energy_price_engine-manual.zip':os.environ['PE_MANUAL_SHA']}
          assert m['commit']==os.environ['PE_SOURCE'] and not m['dirty'] and m['archives']==expected
          for name,digest in expected.items():assert hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest()==digest
          notes=Path('docs/RELEASE_BETA12.md').read_text()
          base=f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/blob/{os.environ["PE_TAG"]}/docs/'
          notes=re.sub(r'\]\((?!https?://)([^)]+)\)',lambda m:']('+base+m[1]+')',notes)
          notes+='\n\nExact source: `'+os.environ['PE_SOURCE']+'`. Annotated tag: `'+os.environ['PE_TAG']+'` (`'+os.environ['PE_TAG_OBJECT']+'`).\n\n```text\n'+Path('dist/SHA256SUMS').read_text()+'```\n'
          (Path(os.environ['RUNNER_TEMP'])/'beta12-notes.md').write_text(notes)
          PY
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - name: Publish authorized beta12 prerelease without replacing assets
        run: |
          set -euo pipefail
          if gh release view "$PE_TAG" >/dev/null 2>&1; then
            python - <<'PY'
          import json,os,subprocess
          r=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["PE_TAG"]}']))
          assert r['prerelease'] and not r['draft'] and r['tag_name']==os.environ['PE_TAG']
          assets={a['name']:a for a in r['assets']};m=json.load(open('dist/BUILD_MANIFEST.json'))
          assert set(assets)=={*m['archives'],'BUILD_MANIFEST.json','SHA256SUMS'}
          for name,digest in m['archives'].items():assert assets[name]['digest']=='sha256:'+digest
          print('Existing immutable beta12 matches; no release or asset mutation')
          PY
          else
            gh release create "$PE_TAG" --target "$PE_SOURCE" dist/ha_energy_price_engine.zip dist/ha_energy_price_engine-manual.zip dist/BUILD_MANIFEST.json dist/SHA256SUMS --prerelease --latest=false --verify-tag --title 'v0.1.0-beta.12 — choose VAT display and preserve native Diagnostics' --notes-file "$RUNNER_TEMP/beta12-notes.md"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PE_TAG" --jq '{html_url,tag_name,draft,prerelease,assets:[.assets[].name]}'
  verify-public:
    name: Verify public beta.12 (${{ matrix.target }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ha-2026.10.3
            lockfile: requirements-dev.lock
          - target: ha-2026.10.4
            lockfile: requirements-ha-current.lock
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.12
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare independent locked core and pinned actual HACS
        run: |
          uv venv
          uv pip sync --require-hashes ${{ matrix.lockfile }}
          uv run --no-project python tools/prepare_hacs_reference.py
      - name: Download and verify public source, assets and actual HACS/native installs
        run: uv run --no-project python tools/verify_public_release.py --expected-commit "$PE_SOURCE" --output "$RUNNER_TEMP/public-beta12"
      - uses: actions/upload-artifact@v4
        with:
          name: pe-beta12-public-${{ matrix.target }}
          path: ${{ runner.temp }}/public-beta12/PUBLIC_RELEASE_RECEIPT.json
          if-no-files-found: error
  audit:
    name: Record verified beta.12 publication
    needs: [publish, verify-public]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/beta5-simple-onboarding
      - uses: actions/download-artifact@v5
        with:
          pattern: pe-beta12-public-*
          path: public-verification
      - name: Record independent public verification and preserve prior releases
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          from datetime import UTC,datetime
          repo=os.environ['GITHUB_REPOSITORY'];source=os.environ['PE_SOURCE'];tag=os.environ['PE_TAG']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          receipts={p.parent.name:json.loads(p.read_text()) for p in Path('public-verification').rglob('PUBLIC_RELEASE_RECEIPT.json')}
          expected={'ha_energy_price_engine.zip':os.environ['PE_HACS_SHA'],'ha_energy_price_engine-manual.zip':os.environ['PE_MANUAL_SHA']}
          assert len(receipts)==2
          for receipt in receipts.values():
              assert receipt['source_commit']==source and receipt['archive_hashes']==expected and receipt['isolated_hacs_and_native_install']=='passed'
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          prior=[]
          for number in range(1,12):
              oldtag=f'v0.1.0-beta.{number}';previous=json.loads(Path(f'docs/receipts/{oldtag}.json').read_text());r=api('releases/tags/'+oldtag)
              assert r['id']==previous['release_id'] and r['prerelease'] and not r['draft']
              assert api('git/ref/tags/'+oldtag)['object']['sha']==previous.get('tag_object',previous.get('annotated_tag_object'))
              assets={a['name']:a for a in r['assets']}
              for name,digest in previous.get('archive_hashes',previous.get('archive_sha256')).items():assert assets[name]['digest']=='sha256:'+digest
              for asset in previous.get('assets',[]):assert all(assets[asset['name']].get(k)==asset[k] for k in ('id','size','digest') if k in asset)
              prior.append({'tag':oldtag,'release_id':r['id'],'tag_and_asset_integrity_preserved':True})
          release=api('releases/tags/'+tag);assert release['prerelease'] and not release['draft']
          tag_object=api('git/ref/tags/'+tag)['object']['sha'];assert tag_object==os.environ['PE_TAG_OBJECT']
          checks=api(f'commits/{source}/check-runs?per_page=100')['check_runs'];assert len(checks)>=18 and all(c['conclusion']=='success' for c in checks)
          jobs=api(f'actions/runs/{os.environ["GITHUB_RUN_ID"]}/jobs')['jobs'];done=[j for j in jobs if j['name'].startswith(('publish','Verify public'))]
          assert len(done)==3 and all(j['conclusion']=='success' for j in done)
          with urllib.request.urlopen(urllib.request.Request(release['html_url'],headers={'User-Agent':'PE-beta12-public-verification'}),timeout=30) as response:status=response.status
          assert status==200
          report={'schema':1,'verified_at':datetime.now(UTC).isoformat(),'tag':tag,'source_commit':source,'tag_object':tag_object,'main_commit':'56cdb3c10993179371483812cbc36f651ba3ad8e','main_unmerged':True,'previous_releases_preserved':True,'prior_releases':prior,'release_url':release['html_url'],'release_id':release['id'],'draft':False,'prerelease':True,'unauthenticated_release_page_http':status,'archive_hashes':expected,'assets':[{k:a.get(k) for k in ('name','id','size','digest','browser_download_url')} for a in release['assets']],'publisher':{'id':int(os.environ['GITHUB_RUN_ID']),'html_url':f'https://github.com/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}','head_sha':os.environ['GITHUB_SHA'],'publication_and_both_verification_jobs':'success','workflow_final_conclusion':'pending audit completion'},'exact_source_checks':[{'name':c['name'],'id':c['id'],'conclusion':c['conclusion'],'url':c['html_url']} for c in checks],'validation':{'ha_cores':['2026.10.3','2026.10.4'],'producer_cases_per_core':139,'producer_coverage_percent':90,'browser_regressions':22,'native_screenshots':18,'skips':0,'warnings':'Two deprecations in pinned upstream HACS code','public_verification':'Fresh jobs on both locked cores independently download metadata/source/main/assets and the original beta11 HACS ZIP; test actual pinned HACS2.0.5/upstream add/beta visibility/beta11-to12 update/reinstall/uninstall and both native ZIP layouts outside source','simulation_receipt':'docs/receipts/v0.1.0-beta.12-simulation.json'},'public_verification_receipts':receipts,'owner_acceptance':False,'remaining_limitations':['Owner real Raspberry Pi/PAHA02-DEV acceptance remains separate from controlled recorded/synthetic native HA QA.','Private rates remain configured values; no future EWII or summer-house contract inference.','Beta10/11 updates in place; older incompatible beta1–9 sites still require explicit reset/recreation.','The standard four rows show truthful missing/additional ranges when the verified schedule differs; extra rows remain unavailable on days where they do not apply.','Existing explicit HA entity-disable or display-precision choices remain user-owned.'],'production_controls_touched':False}
          Path('docs/receipts/v0.1.0-beta.12.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/receipts/v0.1.0-beta.12.json
          git commit -m 'docs: record independent public beta12 verification on both cores'
          git push origin HEAD:refs/heads/feat/beta5-simple-onboarding
      - name: Update existing draft PR with the verified focused prerelease
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/beta12-pr-final.md" <<'MD'
          Published and independently verified **v0.1.0-beta.12**: https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/releases/tag/v0.1.0-beta.12

          Exact immutable source **e506ccfc40b61413bd83e3ce60081a60d517348f**. Implements #17 from published beta.11 source657bc49b091c1aa5fafa6cad0945cd693326d31c. Owner PAHA02-DEV acceptance remains pending; no main/stable or production/charging actions.

          A saved strict boolean Including VAT preference defaults Yes in initial setup and normal Configure, with an enabled localized Yes/No Diagnostic. All beta.11 rows remain:15 Diagnostic/23total on a four-band site. Components and final use the same stored quarter's selected incl/ex basis; ex-VAT final sums unrounded stored components. Actual VAT amount stays unchanged. Day bands use verified cached components and actual local hours. No blind multiplication, mixed quarters or invented zeroes.

          The nine primary sensor values and state classes keep their fixed explicitly labeled VAT basis for Recorder continuity. Card components/final/statistics/grid follow the choice; the raw-source graph remains clearly ex VAT. Internal dashboard schema3 requires a browser/card-resource reload. CM API2 remains canonical VAT-inclusive. No reset for beta10/11, no source requests/reload/ledger write/reprice/revision from preference saves. Eighteen payload files, including math/ledger/adapters/scheduler/API2, remain byte-identical beta11; only11 scoped presentation/settings paths differ.

          Validation:139tests/core on HA2026.10.3/.4,90%coverage,zero skips;22 EN/DA desktop/mobile browser cases;official hassfest/HACS/Ruff;4 independent installed ZIP checks. Eighteen actual native screenshots verify Yes/No,initial setup,normal Configure,current/next/missing,real grid ranges,unchanged VAT,installed card and restart. Upgrade from the hash-verified public beta11 preserves66 original IDs,3 original site data/other settings and2 ledger byte hashes through toggle/locale reload/restart. All3 No preferences persist; browser errors/warnings and source requests from read/toggle assertions are zero. Recorded/synthetic public/private fixtures and clock adapters are QA-only,not owner acceptance.

          Guarded publication verified all exact-source push/PR/tag CI,annotated tag,native/runtime/screenshot hashes,reproducible archives and unchanged main/all prior beta1–11 release/tag/asset identities. Two fresh public jobs independently downloaded source/main/assets/original beta11 ZIP,then tested actual pinned HACS2.0.5/upstream update/reinstall/uninstall and both native package layouts on both locked cores.

          [Native Diagnostics/screenshots](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.12/docs/DIAGNOSTICS.md) · [Native receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.12/docs/receipts/v0.1.0-beta.12-simulation.json) · [Public receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.12.json) · [HACS](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.12/docs/HACS_DISTRIBUTION.md) · [Owner checklist](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.12/docs/BETA_ACCEPTANCE.md).

          HACS Show beta versions → beta.12 → download/restart/reload cached browser/card resources. Keep beta10/11 sites/history. Open native device Diagnostic; Configure → Including VAT changes display. Stop for owner real Pi acceptance. No issue closure or unrelated feature work.
          MD
          gh api "repos/$GITHUB_REPOSITORY/pulls/14" --method PATCH --raw-field title='Beta.12: saved VAT display preference and consistent native Diagnostics' -F body=@"$RUNNER_TEMP/beta12-pr-final.md" --jq '{number,html_url,draft}'
