name: Stable exact-main validation
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact merged main commit to validate
        required: true
        type: string
permissions:
  contents: read
jobs:
  integrity:
    name: stable main integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 0
      - name: Verify actual main and accepted native runtime evidence
        env:
          PE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          test "$(git rev-parse HEAD)" = "$PE_EXPECTED_SOURCE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PE_EXPECTED_SOURCE"
          python tools/verify_stable_source.py --expected-source "$PE_EXPECTED_SOURCE"
  tests:
    needs: integrity
    name: tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fixture-supported-ha-2026.10.3
            lockfile: requirements-dev.lock
          - target: current-ha-2026.10.4
            lockfile: requirements-ha-current.lock
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Install exact hash-verified environment
        run: uv venv && uv pip sync --require-hashes ${{ matrix.lockfile }}
      - name: Prepare pinned actual HACS workflow dependencies
        run: uv run --no-project python tools/prepare_hacs_reference.py
      - run: uv run --no-project ruff check custom_components tests tools
      - run: uv run --no-project ruff format --check custom_components tests tools
      - run: uv run --no-project pytest --cov=custom_components.ha_energy_price_engine --cov-report=term-missing -W error::ResourceWarning
  dashboard:
    needs: integrity
    name: dashboard browser desktop and mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip sync --require-hashes requirements-ha-current.lock
      - name: Generate actual HA producer/source/ledger frontend fixtures
        env:
          PE_FRONTEND_FIXTURES: ${{ runner.temp }}/pe-dashboard-fixtures
        run: uv run --no-project pytest tests/test_dashboard.py -W error::ResourceWarning
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/frontend
          cd tests/frontend
          npx playwright install --with-deps chromium
      - name: Check shipped module and test graphs/tables/interaction/locale/revisions
        env:
          PE_FRONTEND_FIXTURES: ${{ runner.temp }}/pe-dashboard-fixtures
        run: |
          node --check custom_components/ha_energy_price_engine/www/energy-price-engine-card.js
          node --test tests/frontend/dashboard.test.mjs
  hassfest:
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 0
      - uses: home-assistant/actions/hassfest@master
  hacs:
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_source }}
          fetch-depth: 0
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  package:
    needs: integrity
    name: independent beta install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_source }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip sync --require-hashes requirements-ha-current.lock
      - name: Build clean reproducible candidate (no release publication)
        run: uv run --no-project python tools/build_beta.py
      - name: Install HACS asset layout outside repository
        run: uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
      - name: Install manual HA config layout outside repository
        run: uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ha-energy-price-engine-stable-main-${{ inputs.expected_source }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
